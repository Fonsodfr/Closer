# Builds Closer every time code is pushed to main, or by hand from the Actions tab:
#   - macOS:   VST3 + AU, universal (Apple Silicon + Intel), .pkg installer
#   - Windows: VST3 64-bit, Inno Setup installer (.exe)
#   - Release: one zip with both installers and the instructions
# The results are downloadable from the run page, under "Artifacts".
#
# macOS signing and notarization run only when the Apple secrets exist in the
# repository (Settings > Secrets and variables > Actions). Without them
# (for example in a fork) the build still works, signed ad-hoc for local use.

name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 60

    env:
      TEAM_ID: HQ2LZNV52F
      APP_IDENTITY: "Developer ID Application: Alfonso Javier De Frutos Roldan (HQ2LZNV52F)"
      INSTALLER_ID_NAME: "Developer ID Installer: Alfonso Javier De Frutos Roldan (HQ2LZNV52F)"
      HAS_SIGNING: ${{ secrets.MACOS_APP_P12 != '' }}

    steps:
      - name: Get the Closer code
        uses: actions/checkout@v4

      - name: Get JUCE 9.0.3 (same version as on Windows)
        run: git clone --depth 1 --branch 9.0.3 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # ---- Signing certificates (only with the secrets) ----
      - name: Import the Developer ID certificates
        if: env.HAS_SIGNING == 'true'
        env:
          APP_P12: ${{ secrets.MACOS_APP_P12 }}
          INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo "$APP_P12"       | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$RUNNER_TEMP/app.p12"       -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # Make the new keychain searchable (keep the system ones too)
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security find-identity -v "$KEYCHAIN"

      - name: Sign the plugins
        run: |
          cd build/Closer_artefacts/Release
          if [ "$HAS_SIGNING" = "true" ]; then
            # Developer ID + hardened runtime + secure timestamp: required for notarization
            for bundle in VST3/Closer.vst3 AU/Closer.component; do
              codesign --force --options runtime --timestamp \
                       --keychain "$SIGNING_KEYCHAIN" \
                       --sign "$APP_IDENTITY" "$bundle"
              codesign --verify --strict --verbose=2 "$bundle"
            done
          else
            echo "No signing secrets: signing ad-hoc (local use only)"
            codesign --force --deep --sign - VST3/Closer.vst3
            codesign --force --deep --sign - AU/Closer.component
          fi

      - name: Validate the Audio Unit
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Closer_artefacts/Release/AU/Closer.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Clsr Rvfc

      - name: Build the installer
        run: |
          if [ "$HAS_SIGNING" = "true" ]; then
            export INSTALLER_IDENTITY="$INSTALLER_ID_NAME"
          fi
          bash packaging/macos/build-pkg.sh

      # ---- Notarization: Apple checks the installer and approves it ----
      - name: Notarize and staple the installer
        if: env.HAS_SIGNING == 'true'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          KEY_FILE="$RUNNER_TEMP/AuthKey_$NOTARY_KEY_ID.p8"
          printf '%s\n' "$NOTARY_KEY" > "$KEY_FILE"

          xcrun notarytool submit Closer-Installer.pkg \
                --key "$KEY_FILE" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
                --wait --timeout 30m --output-format json | tee notary.json

          rm -f "$KEY_FILE"

          if ! grep -q '"status" *: *"Accepted"' notary.json; then
            echo "Notarization was not accepted. Apple's log:"
            ID=$(sed -nE 's/.*"id" *: *"([^"]+)".*/\1/p' notary.json | head -1)
            printf '%s\n' "$NOTARY_KEY" > "$KEY_FILE"
            xcrun notarytool log "$ID" --key "$KEY_FILE" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
            rm -f "$KEY_FILE"
            exit 1
          fi

          # Attach Apple's approval to the installer, so it also works offline
          xcrun stapler staple Closer-Installer.pkg
          xcrun stapler validate Closer-Installer.pkg

          # The same check macOS does when a user opens the installer
          spctl --assess --type install --verbose=4 Closer-Installer.pkg

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Closer-macOS
          path: |
            Closer-Installer.pkg
            packaging/INSTALL-macOS.txt
          retention-days: 30

      - name: Remove the signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true

  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Get the Closer code
        uses: actions/checkout@v4

      - name: Get JUCE 9.0.3 (same version as on macOS)
        run: git clone --depth 1 --branch 9.0.3 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project \(Closer VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          Write-Host "Building Closer-Setup.exe, version $version"
          & $iscc "/DAppVersion=$version" "/DSourceDir=$env:GITHUB_WORKSPACE\build\Closer_artefacts\Release\VST3" packaging\windows\closer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Closer-Windows
          path: |
            installer-output/Closer-Setup.exe
            packaging/INSTALL-Windows.txt
          retention-days: 30

  # One zip with everything, ready to share or upload to a store
  release:
    needs: [ macos, windows ]
    runs-on: ubuntu-latest

    steps:
      - name: Get the Closer code
        uses: actions/checkout@v4

      - name: Get the macOS build
        uses: actions/download-artifact@v4
        with:
          name: Closer-macOS
          path: mac

      - name: Get the Windows build
        uses: actions/download-artifact@v4
        with:
          name: Closer-Windows
          path: win

      - name: Make the zip
        run: |
          VERSION=$(sed -nE 's/^project \(Closer VERSION ([0-9.]+)\).*/\1/p' CMakeLists.txt)
          DIR="Closer-$VERSION"
          mkdir -p "$DIR/macOS" "$DIR/Windows"
          cp "$(find mac -name Closer-Installer.pkg)"  "$DIR/macOS/"
          cp "$(find mac -name INSTALL-macOS.txt)"     "$DIR/macOS/"
          cp "$(find win -name Closer-Setup.exe)"      "$DIR/Windows/"
          cp "$(find win -name INSTALL-Windows.txt)"   "$DIR/Windows/"
          echo "ZIP_DIR=$DIR" >> "$GITHUB_ENV"
          ls -la "$DIR"/*

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_DIR }}
          path: ${{ env.ZIP_DIR }}/
          retention-days: 90
